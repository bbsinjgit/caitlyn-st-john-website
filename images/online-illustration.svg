<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Illustration of a cosy corner: an armchair with a blanket, a laptop and a mug of tea on a small table, a plant, and a window with a sunny view">
  <!-- wall and floor -->
  <rect width="600" height="400" fill="#DDAB8E"/>
  <rect y="318" width="600" height="82" fill="#C9977A"/>
  <ellipse cx="300" cy="352" rx="250" ry="26" fill="#EDEAE0" opacity=".55"/>

  <!-- arched window -->
  <path d="M60 300 V130 a75 75 0 0 1 150 0 V300 Z" fill="#F6F3EC"/>
  <path d="M72 290 V132 a63 63 0 0 1 126 0 V290 Z" fill="#DEDFD0"/>
  <circle cx="160" cy="118" r="22" fill="#C08A34"/>
  <path d="M72 290 V232 C100 210 128 222 150 212 C170 203 186 210 198 205 V290 Z" fill="#9C9E80"/>
  <path d="M72 290 V258 C104 244 140 256 198 240 V290 Z" fill="#626033"/>
  <rect x="133" y="70" width="4" height="220" fill="#F6F3EC"/>
  <rect x="72" y="196" width="126" height="4" fill="#F6F3EC"/>
  <rect x="52" y="296" width="166" height="12" rx="6" fill="#F6F3EC"/>

  <!-- plant -->
  <g transform="translate(26 0)">
  <path d="M510 318 h40 l-6 -42 h-28 Z" fill="#D37E5F"/>
  <rect x="512" y="270" width="36" height="8" rx="4" fill="#8C4A2F"/>
  <path d="M530 272 C516 246 500 236 486 232 C498 248 508 258 528 274 Z" fill="#626033"/>
  <path d="M530 272 C536 240 546 222 560 212 C556 234 548 252 532 274 Z" fill="#9C9E80"/>
  <path d="M530 272 C524 236 526 214 534 196 C540 220 538 246 532 274 Z" fill="#626033"/>
  </g>
  <!-- armchair -->
  <path d="M250 330 V180 a70 70 0 0 1 70 -70 h20 a70 70 0 0 1 70 70 V330 Z" fill="#8C4A2F"/>
  <rect x="222" y="226" width="56" height="104" rx="28" fill="#7A3F27"/>
  <rect x="382" y="226" width="56" height="104" rx="28" fill="#7A3F27"/>
  <rect x="262" y="250" width="136" height="64" rx="18" fill="#9A5536"/>
  <rect x="240" y="326" width="12" height="22" rx="4" fill="#2F2C1A"/>
  <rect x="408" y="326" width="12" height="22" rx="4" fill="#2F2C1A"/>
  <!-- blanket -->
  <path d="M300 150 C330 140 368 146 392 160 L384 300 C360 310 334 306 312 296 Z" fill="#D37E5F"/>
  <path d="M312 296 C334 306 360 310 384 300 L380 318 C356 326 332 322 310 312 Z" fill="#C08A34"/>
  <path d="M322 168 L314 290 M344 160 L338 298 M366 162 L362 302" stroke="#C26C4E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- cushion -->
  <ellipse cx="292" cy="236" rx="30" ry="24" fill="#C08A34"/>

  <!-- side table -->
  <rect x="444" y="252" width="104" height="10" rx="5" fill="#626033"/>
  <rect x="456" y="262" width="8" height="70" rx="3" fill="#626033"/>
  <rect x="528" y="262" width="8" height="70" rx="3" fill="#626033"/>

  <!-- laptop -->
  <path d="M452 208 h58 a4 4 0 0 1 4 4 v36 h-66 v-36 a4 4 0 0 1 4 -4 Z" fill="#2F2C1A"/>
  <rect x="454" y="212" width="56" height="34" rx="2" fill="#F3DFD0"/>
  <circle cx="494" cy="222" r="5" fill="#C08A34"/>
  <path d="M454 246 V236 C468 228 482 234 510 228 V246 Z" fill="#9C9E80"/>
  <path d="M442 248 h80 l-4 6 h-72 Z" fill="#4A4628"/>

  <!-- mug -->
  <rect x="520" y="226" width="20" height="24" rx="5" fill="#F6F3EC"/>
  <path d="M540 232 a6 6 0 0 1 0 12" stroke="#F6F3EC" stroke-width="3.5" fill="none"/>
  <rect x="520" y="232" width="20" height="6" fill="#C08A34"/>
  <path d="M526 220 c-4 -6 4 -10 0 -16 M534 220 c-4 -6 4 -10 0 -16" stroke="#F6F3EC" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- hanging lamp -->
  <rect x="379" y="0" width="2" height="54" fill="#2F2C1A"/>
  <path d="M356 76 a24 22 0 0 1 48 0 Z" fill="#C08A34"/>
  <circle cx="380" cy="80" r="5" fill="#F6F3EC"/>
